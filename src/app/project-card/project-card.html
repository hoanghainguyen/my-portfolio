<div class="border border-surface-border rounded-lg shadow-sm p-6 bg-surface hover:shadow-md transition-shadow">
  <h3 class="text-xl font-semibold mb-2 text-ink">{{ project.name }}</h3>
  <p class="text-body mb-4">{{ project.description }}</p>
  <div class="mb-4">
    <h4 class="text-sm font-medium text-ink">Tech Stack:</h4>
    <ul class="flex flex-wrap gap-2  mb-5">
      @for (tech of project.techStack; track tech) {
        <li class="text-xs text-muted uppercase tracking-wide bg-tag-bg text-tag-text text-xs px-2 py-1 rounded">{{ tech }}</li>
      }
    </ul>
  </div>
  <a [href]="project.liveUrl" target="_blank" class="inline-block bg-brand text-white px-4 py-2 rounded-sm hover:bg-brand-hover transition-colors">
    View Live
  </a>
</div>
